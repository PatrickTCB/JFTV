# Nostalgex (Jellyfin, Apple TV) — tvOS unit tests
# This fork is a Jellyfin-only Apple TV app. The web tuner, marketing site,
# Docker container and Roku port that used to live in this repo are gone, so
# CI only builds and tests the tvOS app.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, so a red job can't hide behind pushes that skip it.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos-unit-tests:
    name: tvOS unit tests (NostalgexTests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # tvOS deployment target must be <= SDK on the runner.
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available "tvOS" | head -40

      - name: Run NostalgexTests
        # TEST_RUNNER_ vars reach the test host without the prefix. The two
        # discovery timing tests skip on these shared runners; they run locally.
        env:
          TEST_RUNNER_NOSTALGEX_SKIP_TIMING: "1"
        run: |
          set -eo pipefail
          xcodebuild test \
            -project Nostalgex/Nostalgex.xcodeproj \
            -scheme Nostalgex \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -only-testing:NostalgexTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
